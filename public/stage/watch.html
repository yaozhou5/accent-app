<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>The stage · watching</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/stage/stage.css">
<style>
  .sheet { padding-bottom: 50vh; min-height: 100vh; position: relative; }
  .ln { min-height: 1.6em; border-radius: 3px; margin: 0 -8px; padding: 0 8px; cursor: pointer; transition: background .2s; -webkit-tap-highlight-color: transparent; }
  .ln:hover { background: rgba(26,26,24,.035); }
  .ln.open { background: #EEF1FE; }
  .ln.active { cursor: default; }
  .ln.active:hover { background: transparent; }
  .pop .acts button:disabled { opacity: .35; }
  .ln.mine { box-shadow: inset 2px 0 0 #4B6CF8; }
  .ln { position: relative; }
  /* Someone has left a note on this line. A tint only: no count, nothing to click. */
  .ln.noted { text-decoration: underline; text-decoration-color: rgba(75,108,248,.30); text-decoration-thickness: 2px; text-underline-offset: 7px; }
  .pop .log { margin: 9px 2px 0; padding-top: 8px; border-top: 1px solid var(--line); font-size: 12.5px; line-height: 1.45; color: var(--dim); }
  .pop .log b { font-weight: 500; color: var(--ink); }
  .pop .log p { margin: 0 0 4px; }
  /* Your own notes, shown in full right under the line you sent them on. */
  .mynote { margin: 2px 0 10px; padding: 4px 10px; border-left: 2px solid #4B6CF8; font-family: var(--sans); font-size: 13.5px; line-height: 1.45; color: #3550C4; background: rgba(75,108,248,.05); border-radius: 0 4px 4px 0; }
  .mynote p { margin: 0; }
  .mynote p + p { margin-top: 3px; }
  .mygone { margin-top: 28px; padding-top: 12px; border-top: 1px solid var(--line); font-family: var(--sans); font-size: 13px; color: var(--dim); }
  .mygone h3 { margin: 0 0 8px; font-family: var(--mono); font-weight: 400; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
  .mygone .was { font-family: var(--serif); text-decoration: line-through; color: var(--faint); }
  .crowd { font-size: 11px; color: var(--dim); margin-left: 10px; letter-spacing: .06em; }
  .sheet .fresh { animation: ink .5s ease-out both; }
  @keyframes ink { from { opacity: 0; } }
  .caret { display: inline-block; width: 2px; height: 1.15em; margin: 0 -1px; vertical-align: -0.2em; background: var(--live); border-radius: 1px; }
  .caret.idle { animation: blink 1.1s steps(1) infinite; }
  .caret.thinking { animation: slow 2.4s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes slow { 50% { opacity: .15; } }

  .waiting {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    font-family: var(--serif); font-weight: 300; font-size: clamp(20px, 2vw, 24px); color: var(--dim); padding: 24px; transition: opacity .4s; pointer-events: none;
  }
  .waiting.gone { opacity: 0; }
  .waiting em { display: block; margin-top: 10px; font-family: var(--sans); font-style: normal; font-size: 13px; color: var(--faint); }
  .hint { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); font-size: 12.5px; color: var(--faint); transition: opacity .6s; pointer-events: none; z-index: 4; white-space: nowrap; }
  .hint.gone { opacity: 0; }
  .state { display: inline-flex; align-items: center; gap: 8px; }

  /* The popover sits right under the tapped line. */
  .pop {
    position: absolute; z-index: 7; font-family: var(--sans); font-size: 14px; font-weight: 400; line-height: 1.4;
    background: #FBF8F3; border: 1px solid rgba(26,26,24,.16); border-radius: 12px; padding: 8px; box-shadow: 0 14px 30px -18px rgba(26,26,24,.4);
    white-space: normal; animation: pop .18s ease-out both;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(-4px); } }
  .pop .acts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
  .pop label { display: block; margin: 9px 2px -2px; font-size: 11.5px; color: var(--dim); }
  .pop .acts button { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 9px 4px; color: var(--ink); font-size: 13.5px; }
  .pop .acts button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper); }
  .pop form { display: flex; gap: 6px; margin-top: 8px; }
  .pop input { flex: 1; min-width: 0; border: 1px solid rgba(26,26,24,.2); border-radius: 8px; padding: 9px 10px; font: inherit; font-size: 16px; background: #fff; color: var(--ink); }
  .pop form button { border: 0; border-radius: 8px; background: var(--ink); color: var(--paper); padding: 0 14px; font-size: 13.5px; }
  .pop .done { margin: 8px 4px 2px; font-size: 12.5px; color: var(--dim); }

  .dock {
    position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    width: min(460px, calc(100vw - 28px)); display: flex; gap: 6px; align-items: center; z-index: 6;
  }
  .reacts { display: flex; gap: 2px; background: rgba(251,248,243,.94); backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: 999px; padding: 3px; box-shadow: 0 10px 30px -18px rgba(26,26,24,.35); }
  .reacts button { border: 0; background: none; font-size: 21px; width: 40px; height: 40px; border-radius: 50%; line-height: 1; transition: transform .15s, opacity .2s; }
  .reacts button:active { transform: scale(1.25); }
  .reacts button:disabled { opacity: .35; }
  form.suggest {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; background: rgba(251,248,243,.94); backdrop-filter: blur(6px);
    border: 1px solid var(--line); border-radius: 999px; padding: 4px 4px 4px 14px; box-shadow: 0 10px 30px -18px rgba(26,26,24,.35);
  }
  form.suggest input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 16px; color: var(--ink); padding: 8px 0; }
  form.suggest input::placeholder { color: var(--faint); }
  form.suggest button { border: 0; border-radius: 999px; background: var(--ink); color: var(--paper); font-size: 13px; padding: 10px 13px; }
  form.suggest button:disabled { opacity: .35; }
  .chat {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(max(18px, env(safe-area-inset-bottom)) + 58px);
    width: min(460px, calc(100vw - 28px)); max-height: 34vh; z-index: 5; display: flex; flex-direction: column;
    background: rgba(251,248,243,.94); backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 10px 30px -18px rgba(26,26,24,.35);
  }
  .chat[hidden] { display: none; }
  .chat-head { display: flex; justify-content: space-between; align-items: center; padding: 7px 12px 5px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
  .chat-head button { border: 0; background: none; font: inherit; color: var(--dim); text-transform: none; letter-spacing: 0; font-family: var(--sans); font-size: 12px; padding: 2px 4px; }
  .chat-feed { overflow-y: auto; padding: 0 10px 10px; display: flex; flex-direction: column; gap: 6px; }
  .chat.min .chat-feed { display: none; }
  .bubble { align-self: flex-start; max-width: 85%; background: #fff; border: 1px solid var(--line); border-radius: 12px 12px 12px 4px; padding: 5px 10px 6px; font-size: 14px; line-height: 1.4; color: var(--ink); word-wrap: break-word; }
  .bubble b { display: block; font-weight: 500; font-size: 11px; color: var(--dim); margin-bottom: 1px; }
  .bubble.mine { align-self: flex-end; background: var(--ink); color: var(--paper); border-color: var(--ink); border-radius: 12px 12px 4px 12px; }
  .bubble.mine b { color: rgba(245,240,232,.6); }
  .bubble.writer b { color: var(--live); }
  form.suggest .who { flex: none; border: 0; background: rgba(26,26,24,.06); color: var(--dim); border-radius: 999px; padding: 6px 9px; font-size: 12px; max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  form.suggest { padding-left: 5px; }

  /* The reveal: after Wrap up, everyone sees every note, by line, with outcomes. */
  .reveal { position: fixed; inset: 0; z-index: 9; background: rgba(26,26,24,.3); display: flex; justify-content: center; align-items: flex-start; padding: 56px 12px 20px; overflow-y: auto; }
  .reveal[hidden] { display: none; }
  .reveal-card { width: min(640px, 100%); background: var(--paper); border-radius: 12px; padding: 18px 20px 20px; box-shadow: 0 18px 50px rgba(26,26,24,.2); }
  .reveal-card header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .reveal-card h2 { margin: 0; font-family: var(--mono); font-weight: 400; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
  .reveal-card header button { border: 0; background: none; font-size: 20px; color: var(--dim); }
  .reveal-card .lede { margin: 0 0 14px; font-size: 13px; color: var(--dim); }
  .rg { margin-bottom: 16px; }
  .rg .line { margin: 0 0 6px; padding-left: 9px; border-left: 2px solid var(--line); font-family: var(--serif); font-size: 16px; line-height: 1.4; }
  .rg .line.removed { text-decoration: line-through; color: var(--faint); }
  .rn { margin: 0 0 5px 11px; font-size: 13.5px; line-height: 1.45; }
  .rn b { font-weight: 500; }
  .rn .st { margin-left: 6px; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: rgba(26,26,24,.06); color: var(--dim); white-space: nowrap; }
  .rn .st.used { background: #E3EFD6; color: #3B6D11; }
  .rn .st.cut { background: #F4D9D4; color: var(--live); }
  .sent { position: fixed; left: 50%; bottom: calc(max(18px, env(safe-area-inset-bottom)) + 60px); transform: translateX(-50%); font-size: 12.5px; color: var(--paper); background: var(--ink); padding: 6px 12px; border-radius: 999px; opacity: 0; transition: opacity .3s; z-index: 6; white-space: nowrap; pointer-events: none; }
  .sent.on { opacity: 1; }
  @media (max-width: 600px) { .sheet { padding-top: 96px; } .corner.tl .mono { display: none; } }
  @media (prefers-reduced-motion: reduce) { .caret, .sheet .fresh, .pop { animation: none !important; } }
</style>
</head>
<body>
  <div class="corner tl"><span class="mark">accent<i>.</i></span><span class="mono">the stage</span></div>
  <div class="corner tr"><span class="state mono"><span class="dot"></span><span id="stateLabel">Connecting…</span></span><span class="crowd mono" id="crowd"></span></div>

  <main class="page"><div class="sheet" id="sheet" aria-live="off"></div></main>
  <div class="waiting" id="waiting">The page is still empty.<em>You'll see the writing appear the moment they go live.</em></div>
  <div class="hint gone" id="hint">Tap a line to react to it</div>

  <p class="sent" id="sent" role="status"></p>
  <div class="chat" id="chat" hidden>
    <div class="chat-head"><span>Room chat</span><button type="button" id="chatMin">Hide</button></div>
    <div class="chat-feed" id="chatFeed" aria-live="polite"></div>
  </div>
  <div class="reveal" id="reveal" role="dialog" aria-modal="true" aria-labelledby="revealTitle" hidden>
    <div class="reveal-card">
      <header><h2 id="revealTitle">Notes from this session</h2><button type="button" id="revealClose" aria-label="Close">×</button></header>
      <p class="lede">The writer wrapped up. Here is every note, by line, and what became of it.</p>
      <div id="revealList"></div>
    </div>
  </div>
  <div class="dock">
    <div class="reacts" role="group" aria-label="React">
      <button type="button" data-e="eyes" aria-label="Watching">👀</button>
      <button type="button" data-e="heart" aria-label="Love">❤️</button>
      <button type="button" data-e="laugh" aria-label="Funny">😂</button>
    </div>
    <form class="suggest" id="suggest" autocomplete="off">
      <button type="button" class="who" id="who" title="Change your name"></button>
      <input id="word" maxlength="200" placeholder="Say something to the room" aria-label="Say something to the room">
      <button id="send" type="submit" disabled>Send</button>
    </form>
  </div>

<script type="module">
import { createBus, apply } from "/stage/bus.js";

const room = decodeURIComponent(location.pathname.split("/").filter(Boolean).pop() || "");
const $ = (id) => document.getElementById(id);
const sheet = $("sheet"), waiting = $("waiting"), stateLabel = $("stateLabel"), hint = $("hint");
const form = $("suggest"), word = $("word"), send = $("send"), sent = $("sent");

// A stable anonymous id per tab, so the writer can keep one note per person per line.
let me = sessionStorage.getItem("stage-me");
if (!me) { me = Math.random().toString(36).slice(2, 10); sessionStorage.setItem("stage-me", me); }

// The name the room sees in chat, and the name on your notes when the writer reveals them.
let myName = sessionStorage.getItem("stage-name") || "";
if (!myName) { myName = "Guest " + (10 + Math.floor(Math.random() * 90)); sessionStorage.setItem("stage-name", myName); }

let text = "", ids = [], seq = -1, caret = 0, live = false;
let typingT, thinkT;
const myNotes = new Map();   // lineId -> type
// What I've sent, and what everyone else in the room is doing, per line.
const logKey = "stage-sent:" + location.pathname;
const sentLog = new Map(JSON.parse(sessionStorage.getItem(logKey) || "[]"));   // lineId -> [{type, text}]
const crowd = new Map();       // lineId -> Map(author -> Set(types))
const KIND_WORD = { love: "♥", unclear: "unclear", cut: "cut", suggest: "suggest", note: "note" };
function myNoteEl(arr) {
  const el = document.createElement("div"); el.className = "mynote";
  for (const m of arr) {
    const p = document.createElement("p");
    p.textContent = m.type === "love" ? "You loved this line" : m.type === "unclear" ? "You marked this unclear" : m.type === "cut" ? "You'd cut this line"
      : m.type === "suggest" ? "You suggested: “" + m.text + "”" : "You: " + m.text;
    el.append(p);
  }
  return el;
}
let openLine = null;          // line with the popover open
let openSnap = "";           // that line's text when it was tapped
let orphan = false;           // the writer removed the open line
let lastOp = 0, activeT;      // the line being typed right now isn't tappable yet
let suggesting = false;

const caretEl = document.createElement("span");
caretEl.className = "caret idle";
const pop = document.createElement("div");
pop.className = "pop";

// Each line is its own tappable block, with the caret and freshly typed characters inside.
function render(freshFrom = -1, freshLen = 0) {
  sheet.textContent = "";
  const c = Math.max(0, Math.min(caret, text.length));
  let start = 0;
  text.split("\n").forEach((line, i) => {
    const end = start + line.length;
    const id = ids[i] || "";
    const div = document.createElement("div");
    const active = c >= start && c <= end && Date.now() - lastOp < 2500;
    div.className = "ln" + (active ? " active" : "") + (myNotes.has(id) ? " mine" : "") + (id && id === openLine ? " open" : "");
    div.dataset.line = id;
    if (id && (crowd.has(id) || (sentLog.get(id) || []).length)) div.classList.add("noted");
    const cuts = new Set([start, end]);
    const hasCaret = c >= start && c <= end;
    if (hasCaret) cuts.add(c);
    if (freshLen > 0) { cuts.add(Math.max(start, Math.min(end, freshFrom))); cuts.add(Math.max(start, Math.min(end, freshFrom + freshLen))); }
    const pts = [...cuts].sort((a, b) => a - b);
    for (let k = 0; k < pts.length; k++) {
      const a = pts[k], b = pts[k + 1];
      if (hasCaret && a === c && !div.contains(caretEl)) div.append(caretEl);
      if (b === undefined || b <= a) continue;
      const s = text.slice(a, b);
      if (freshLen > 0 && a >= freshFrom && b <= freshFrom + freshLen) { const sp = document.createElement("span"); sp.className = "fresh"; sp.textContent = s; div.append(sp); }
      else div.append(s);
    }
    if (!line && !div.contains(caretEl)) div.append("​");
    sheet.append(div);
    const mine = id && sentLog.get(id);
    if (mine && mine.length) sheet.append(myNoteEl(mine));
    start = end + 1;
  });
  // Notes you left on lines the writer has since removed: keep them visible at the end.
  const gone = [...sentLog.entries()].filter(([id, arr]) => arr.length && !ids.includes(id));
  if (gone.length && text) {
    const box = document.createElement("div"); box.className = "mygone";
    const h = document.createElement("h3"); h.textContent = "Your notes on lines the writer removed"; box.append(h);
    for (const [, arr] of gone) {
      const was = document.createElement("p"); was.className = "was"; was.textContent = arr[arr.length - 1].snap || "(a line)"; box.append(was);
      box.append(myNoteEl(arr));
    }
    sheet.append(box);
  }
  placePop();
  waiting.classList.toggle("gone", live || text.length > 0);
  follow();
}

function typed() {
  caretEl.className = "caret";
  clearTimeout(typingT); clearTimeout(thinkT);
  typingT = setTimeout(() => { caretEl.className = "caret idle"; }, 700);
  thinkT = setTimeout(() => { caretEl.className = "caret thinking"; }, 4000);
}

function follow() {
  if (openLine) return;                      // don't scroll away while someone is reacting
  const r = caretEl.getBoundingClientRect();
  if (r.bottom > innerHeight - 150 || r.top < 80) caretEl.scrollIntoView({ block: "center", behavior: "smooth" });
}

function setLive(on) {
  live = on;
  document.body.classList.toggle("is-live", on);
  stateLabel.textContent = on ? "Live" : (text ? "Paused" : "Not live");
  caretEl.style.visibility = on ? "visible" : "hidden";
  if (on && !sessionStorage.getItem("stage-hint")) { hint.classList.remove("gone"); setTimeout(() => hint.classList.add("gone"), 5000); sessionStorage.setItem("stage-hint", "1"); }
}

// ---- Line popover: Love / Unclear / Cut / Suggest ---------------------------------
const KINDS = [["love", "Love"], ["unclear", "Unclear"], ["cut", "Cut"], ["suggest", "Suggest"], ["note", "Note"]];
const COMPOSE = new Set(["suggest", "note"]);   // these open a text field; `suggesting` holds which one
const lineText = (id) => { const i = ids.indexOf(id); return i < 0 ? "" : text.split("\n")[i]; };

// The popover lives outside the text (re-rendering the text never touches it, so a
// phone keyboard stays open while the writer keeps typing). It just follows its line.
function placePop() {
  if (!openLine) return;
  const host = sheet.querySelector(`.ln[data-line="${openLine}"]`);
  if (!host) {                                  // line removed mid-tap: keep the popover where it was
    if (pop.isConnected && !orphan) {
      const draft = pop.querySelector("input")?.value;
      orphan = true; buildPop();
      if (draft != null) { const i = pop.querySelector("input"); if (i) i.value = draft; }
    }
    else if (!pop.isConnected) closePop();
    return;
  }
  const r = host.getBoundingClientRect(), s = sheet.getBoundingClientRect();
  const cs = getComputedStyle(sheet);
  const left = s.left + parseFloat(cs.paddingLeft) - 8, width = s.width - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) + 16;
  pop.style.top = (r.bottom + scrollY + 6) + "px";
  pop.style.left = (left + scrollX) + "px";
  pop.style.width = width + "px";
  if (!pop.isConnected) document.body.append(pop);
}
addEventListener("resize", placePop);

function openPop(lineId) { openLine = lineId; openSnap = lineText(lineId); orphan = false; suggesting = false; buildPop(); render(); }
function closePop() { openLine = null; orphan = false; suggesting = false; pop.remove(); }

function makeLog() {
  const mine = sentLog.get(openLine) || [];
  if (!mine.length) return null;
  const log = document.createElement("div"); log.className = "log";
    for (const m of mine) {
      const p = document.createElement("p");
      const b = document.createElement("b"); b.textContent = "You · " + ({ love: "Loved this", unclear: "Unclear", cut: "Cut?", suggest: "Suggested", note: "Note" }[m.type]);
      p.append(b); if (m.text) p.append(": " + m.text);
      log.append(p);
    }
  return log;
}
// Someone else acted on the open line: refresh just the summary, never the buttons or what you're typing.
function refreshLog() {
  const old = pop.querySelector(".log"), fresh = makeLog();
  if (old && fresh) old.replaceWith(fresh);
  else if (old) old.remove();
  else if (fresh) { const after = pop.querySelector(".done"); after ? pop.insertBefore(fresh, after) : pop.append(fresh); }
}
function buildPop(doneMsg) {
  pop.textContent = "";
  const acts = document.createElement("div"); acts.className = "acts";
  for (const [k, l] of KINDS) {
    const b = document.createElement("button"); b.type = "button"; b.textContent = l; b.dataset.k = k;
    b.setAttribute("aria-pressed", String(COMPOSE.has(k) ? suggesting === k : myNotes.get(openLine) === k));
    if (orphan && !COMPOSE.has(k)) b.disabled = true;
    acts.append(b);
  }
  pop.append(acts);
  if (suggesting) {
    const kind = suggesting;
    const f = document.createElement("form");
    const inp = document.createElement("input");
    inp.maxLength = 400;
    if (kind === "note") {
      // A comment about the line, never wording for it: starts empty and is never put into the text.
      const lab = document.createElement("label"); lab.textContent = "Note on this line"; pop.append(lab);
      inp.setAttribute("aria-label", "Note on this line"); inp.placeholder = "Say something about this line…"; inp.value = "";
    } else {
      inp.setAttribute("aria-label", "Your wording for this line");
      inp.value = orphan ? openSnap : lineText(openLine);
    }
    const go = document.createElement("button"); go.type = "submit"; go.textContent = "Send";
    f.append(inp, go); pop.append(f);
    f.addEventListener("submit", (e) => { e.preventDefault(); const v = inp.value.replace(/\s+/g, " ").trim(); if (v) sendNote(kind, v); });
    setTimeout(() => { inp.focus(); if (kind === "suggest") inp.select(); }, 30);
  }
  const log = makeLog();
  if (log) pop.append(log);
  if (orphan && !doneMsg) { const d = document.createElement("p"); d.className = "done"; d.textContent = "The writer just removed this line. You can still send wording or a note."; pop.append(d); }
  if (doneMsg) { const d = document.createElement("p"); d.className = "done"; d.textContent = doneMsg; pop.append(d); }
}

let lastNote = 0;
const waitingAck = new Map();   // "lineId|type" -> timer
function sendNote(type, suggestion = "") {
  if (!live || !openLine) return;
  if (Date.now() - lastNote < 1200) return;
  lastNote = Date.now();
  const line = openLine;
  if (orphan && !COMPOSE.has(type)) return;
  bus.send("note", { lineId: line, snapshot: orphan ? openSnap : lineText(line), author: me, name: myName, type, text: suggestion });
  if (!orphan && type !== "note") myNotes.set(line, type);
  {
    // One reaction per line (it replaces your last); notes and suggestions add up.
    let arr = (sentLog.get(line) || []).filter((m) => (type === "note" ? true : m.type === "note"));
    if (type === "note") arr = [...(sentLog.get(line) || [])];
    arr.push({ type, text: suggestion, snap: orphan ? openSnap : lineText(line) });
    sentLog.set(line, arr);
    try { sessionStorage.setItem(logKey, JSON.stringify([...sentLog])); } catch {}
  }
  const k = line + "|" + type;
  clearTimeout(waitingAck.get(k));
  waitingAck.set(k, setTimeout(() => { waitingAck.delete(k); flash("Not delivered. The writer may have reloaded. Try again."); }, 4000));
  suggesting = false;
  buildPop({ love: "Sent. You loved this line.", unclear: "Sent. You marked it unclear.", cut: "Sent. You'd cut this line.", suggest: orphan ? "Sent. It lands in the writer's suggestions." : "Sent. Your wording is with the writer.", note: orphan ? "Sent. It lands in the writer's suggestions." : "Sent. Your note is with the writer." }[type]);
  render();
  setTimeout(() => { if (openLine === line && pop.querySelector(".done")) { closePop(); render(); } }, 1600);
}

pop.addEventListener("click", (e) => {
  e.stopPropagation();                         // the buttons get rebuilt below; don't let "outside click" close us
  const b = e.target.closest(".acts button");
  if (!b) return;
  if (COMPOSE.has(b.dataset.k)) { suggesting = suggesting === b.dataset.k ? false : b.dataset.k; buildPop(); render(); }
  else sendNote(b.dataset.k);
});

sheet.addEventListener("click", (e) => {
  if (e.target.closest(".pop")) return;
  const ln = e.target.closest(".ln");
  if (!ln || !live || !ln.dataset.line) return;
  if (!lineText(ln.dataset.line).trim()) return;             // nothing to react to on an empty line
  if (ln.classList.contains("active")) {                    // still being written
    hint.textContent = "Still being written. Tap it once they move on."; hint.classList.remove("gone");
    clearTimeout(hint._t); hint._t = setTimeout(() => hint.classList.add("gone"), 2200);
    return;
  }
  if (openLine === ln.dataset.line) { closePop(); render(); } else openPop(ln.dataset.line);
});
document.addEventListener("click", (e) => { if (openLine && !e.target.closest(".pop") && !e.target.closest(".ln")) { closePop(); render(); } });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && openLine) { closePop(); render(); } });

// Lines without an id can't take notes. Ask the writer for a fresh copy (at most every 5 s).
let askedIds = 0;
function askForIds() {
  const n = text.split("\n").length;
  if (ids.length >= n && ids.slice(0, n).every(Boolean)) return;
  if (Date.now() - askedIds < 5000) return;
  askedIds = Date.now(); seq = -1; bus.send("resync", {});
}

// ---- Live connection ----------------------------------------------------------------
const bus = await createBus(room, "audience");
bus.on("note", (p) => {
  if (!p || !p.lineId || p.author === me) return;
  const who = String(p.author || "?");
  if (!crowd.has(p.lineId)) crowd.set(p.lineId, new Map());
  const m = crowd.get(p.lineId);
  const set = m.get(who) || new Set();
  if (p.type !== "note") for (const t of ["love", "unclear", "cut", "suggest"]) set.delete(t);   // reactions replace each other
  set.add(p.type); m.set(who, set);
  render();
});
bus.onAudience((n) => { $("crowd").textContent = n > 1 ? n + " watching" : ""; });
bus.on("chat", (p) => {
  if (!p || !p.text) return;
  if (p.writer && !fromWriter(p)) return;
  addBubble({ name: String(p.name || "").slice(0, 24), text: String(p.text).slice(0, 200), writer: !!p.writer }, false);
});
const STATUS = { used: "Used", cut: "Cut", skipped: "Skipped", open: "Open", "line removed": "Line removed" };
const SAID = { love: "Loved this", unclear: "Unclear", cut: "Cut?", suggest: "Suggested", note: "Note" };
bus.on("reveal", (p) => {
  if (!fromWriter(p) || !Array.isArray(p.lines)) return;
  const list = $("revealList"); list.textContent = "";
  for (const g of p.lines) {
    const box = document.createElement("section"); box.className = "rg";
    const l = document.createElement("p"); l.className = "line" + (g.removed ? " removed" : ""); l.textContent = g.line || "(a line)"; box.append(l);
    for (const n of g.notes || []) {
      const r = document.createElement("p"); r.className = "rn";
      const b = document.createElement("b"); b.textContent = n.author === me ? "You" : (n.name || "Someone"); r.append(b);
      r.append(" · " + (SAID[n.type] || n.type) + (n.text ? (n.type === "suggest" ? ": “" + n.text + "”" : ": " + n.text) : ""));
      const st = document.createElement("span"); st.className = "st " + (n.status || "").replace(" ", "-"); st.textContent = STATUS[n.status] || ""; if (st.textContent) r.append(st);
      box.append(r);
    }
    list.append(box);
  }
  if (!p.lines.length) list.textContent = "No notes this time.";
  closePop(); $("reveal").hidden = false;
});
$("revealClose").addEventListener("click", () => { $("reveal").hidden = true; });
bus.on("outcome", (p) => {
  if (!fromWriter(p) || !Array.isArray(p.authors) || !p.authors.includes(me)) return;
  flash(p.type === "cut" ? "The writer cut the line you flagged ✓" : "The writer used your wording ✓");
});
bus.on("got", (p) => {
  if (!fromWriter(p) || p.author !== me) return;
  const k = p.lineId + "|" + p.type;
  if (!waitingAck.has(k)) return;
  clearTimeout(waitingAck.get(k)); waitingAck.delete(k);
  flash("Delivered ✓");
});

// Follow one writer tab: the most recent to go live. Messages from older tabs
// (or from a tab still on the old code, which sends no id) are ignored.
let owner = null;
function fromWriter(p) {
  if (!p) return false;
  if (!p.w) return !owner;
  if (!owner || p.w === owner.w) { owner = owner || { w: p.w, since: p.since || 0 }; owner.since = Math.max(owner.since, p.since || 0); return true; }
  if ((p.since || 0) > owner.since) { owner = { w: p.w, since: p.since }; return true; }
  return false;
}

bus.on("snap", (p) => {
  if (!fromWriter(p)) return;
  text = String(p.text || ""); seq = p.seq; caret = p.caret ?? text.length;
  ids = Array.isArray(p.ids) ? p.ids : text.split("\n").map(() => "");
  askForIds();
  setLive(!!p.live); render();
});
bus.on("state", (p) => { if (!fromWriter(p)) return; setLive(!!p.live); if (!p.live) closePop(); render(); });
bus.on("op", (p) => {
  if (!fromWriter(p)) return;
  if (seq < 0) return;
  if (p.seq !== seq + 1) { seq = -1; bus.send("resync", {}); return; }
  seq = p.seq;
  text = apply(text, p);
  if (Array.isArray(p.ids)) ids = p.ids;
  askForIds();
  caret = p.caret ?? p.at + p.ins.length;
  lastOp = Date.now(); clearTimeout(activeT); activeT = setTimeout(() => render(), 2600);
  for (const id of [...myNotes.keys()]) if (!ids.includes(id)) myNotes.delete(id);
  if (!live) setLive(true);
  render(p.ins.length ? p.at : -1, p.ins.length);
  typed();
});
bus.on("caret", (p) => { if (!fromWriter(p)) return; if (p.seq === seq) { caret = p.caret; render(); } });
bus.onStatus((st) => {
  if (st === "CHANNEL_ERROR" || st === "TIMED_OUT" || st === "CLOSED") stateLabel.textContent = "Connecting…";
  else if (st === "SUBSCRIBED") setLive(live);
});

// ---- Reactions: one tap, at most one per 2 seconds ---------------------------------
const reactBtns = [...document.querySelectorAll(".reacts button")];
reactBtns.forEach((b) => b.addEventListener("click", () => {
  if (!live) { flash("They're not live yet"); return; }
  bus.send("react", { e: b.dataset.e, author: me });
  reactBtns.forEach((x) => (x.disabled = true));
  setTimeout(() => reactBtns.forEach((x) => (x.disabled = false)), 2000);
}));

// ---- Room chat: everyone sees it, the writer too. Ephemeral; never kept, never a note. ----
const chat = $("chat"), chatFeed = $("chatFeed"), who = $("who");
who.textContent = myName;
let naming = false;
who.addEventListener("click", () => {
  naming = !naming;
  word.placeholder = naming ? "Your name in the room" : "Say something to the room";
  word.value = naming ? myName : ""; word.focus(); if (naming) word.select();
  send.disabled = !word.value.trim();
});
word.addEventListener("input", () => { send.disabled = !word.value.trim(); });
function addBubble(m, mine) {
  const b = document.createElement("div");
  b.className = "bubble" + (mine ? " mine" : "") + (m.writer ? " writer" : "");
  const n = document.createElement("b"); n.textContent = mine ? "You" : (m.writer ? "Writer" : m.name || "Guest");
  b.append(n, String(m.text || ""));
  chatFeed.append(b);
  while (chatFeed.children.length > 80) chatFeed.firstChild.remove();
  chat.hidden = false;
  chatFeed.scrollTop = chatFeed.scrollHeight;
}
$("chatMin").addEventListener("click", () => { const min = chat.classList.toggle("min"); $("chatMin").textContent = min ? "Show" : "Hide"; });
let lastSent = 0;
form.addEventListener("submit", (e) => {
  e.preventDefault();
  const v = word.value.replace(/\s+/g, " ").trim();
  if (!v) return;
  if (naming) {
    myName = v.slice(0, 24); sessionStorage.setItem("stage-name", myName); who.textContent = myName;
    naming = false; word.placeholder = "Say something to the room"; word.value = ""; send.disabled = true;
    flash("You're " + myName + " in this room"); return;
  }
  const wait = 1500 - (Date.now() - lastSent);
  if (wait > 0) return;
  const m = { name: myName, author: me, text: v.slice(0, 200) };
  bus.send("chat", m);
  lastSent = Date.now();
  addBubble(m, true);
  word.value = ""; send.disabled = true;
});
function flash(m) { sent.textContent = m; sent.classList.add("on"); clearTimeout(flash.t); flash.t = setTimeout(() => sent.classList.remove("on"), 2600); }

render();
await bus.ready;
bus.send("hello", {});
// Ask again every second until the writer answers; after 6 s with no answer, they're simply not live.
let tries = 0;
const helloT = setInterval(() => {
  if (seq >= 0 || owner) return clearInterval(helloT);
  if (++tries >= 6) { clearInterval(helloT); setLive(false); return; }
  bus.send("hello", {});
}, 1000);
</script>
</body>
</html>
