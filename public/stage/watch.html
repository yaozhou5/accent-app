<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>The stage · watching</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/stage/stage.css">
<style>
  .sheet { padding-bottom: 46vh; min-height: 100vh; }
  .sheet .fresh { animation: ink .5s ease-out both; }
  @keyframes ink { from { opacity: 0; } }
  .caret {
    display: inline-block; width: 2px; height: 1.15em; margin: 0 -1px; vertical-align: -0.2em;
    background: var(--live); border-radius: 1px;
  }
  .caret.idle { animation: blink 1.1s steps(1) infinite; }
  .caret.thinking { animation: slow 2.4s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes slow { 50% { opacity: .15; } }

  .waiting {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
    font-family: var(--serif); font-weight: 300; font-size: clamp(20px, 2vw, 24px); color: var(--dim); padding: 24px;
    transition: opacity .4s; pointer-events: none;
  }
  .waiting.gone { opacity: 0; }
  .waiting em { display: block; margin-top: 10px; font-family: var(--sans); font-style: normal; font-size: 13px; color: var(--faint); }

  .state { display: inline-flex; align-items: center; gap: 8px; }

  form.suggest {
    position: fixed; left: 50%; bottom: max(22px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    width: min(440px, calc(100vw - 32px)); display: flex; align-items: center; gap: 6px;
    background: rgba(251,248,243,.94); backdrop-filter: blur(6px);
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 5px 5px 18px; z-index: 6;
    box-shadow: 0 10px 30px -18px rgba(26,26,24,.35);
  }
  form.suggest input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 16px; color: var(--ink); padding: 8px 0; }
  form.suggest input::placeholder { color: var(--faint); }
  form.suggest button { border: 0; border-radius: 999px; background: var(--ink); color: var(--paper); font-size: 13px; padding: 9px 14px; }
  form.suggest button:disabled { opacity: .35; cursor: default; }
  .sent { position: fixed; left: 50%; bottom: calc(max(22px, env(safe-area-inset-bottom)) + 58px); transform: translateX(-50%); font-size: 12.5px; color: var(--dim); opacity: 0; transition: opacity .3s; z-index: 6; }
  .sent.on { opacity: 1; }
  @media (max-width: 600px) { .sheet { padding-top: 92px; } .corner.tl .mono { display: none; } }
  @media (prefers-reduced-motion: reduce) { .caret, .sheet .fresh { animation: none !important; } }
</style>
</head>
<body>
  <div class="corner tl"><span class="mark">accent<i>.</i></span><span class="mono">the stage</span></div>
  <div class="corner tr"><span class="state mono" id="state"><span class="dot"></span><span id="stateLabel">Not live</span></span></div>

  <main class="page"><div class="sheet" id="sheet" aria-live="off"></div></main>
  <div class="waiting" id="waiting">The page is still empty.<em>You'll see the writing appear the moment they go live.</em></div>

  <p class="sent" id="sent" role="status"></p>
  <form class="suggest" id="suggest" autocomplete="off">
    <input id="word" maxlength="80" placeholder="Suggest a word or phrase" aria-label="Suggest a word or phrase to the writer">
    <button id="send" type="submit" disabled>Send</button>
  </form>

<script type="module">
import { createBus, apply } from "/stage/bus.js";

const room = decodeURIComponent(location.pathname.split("/").filter(Boolean).pop() || "");
const sheet = document.getElementById("sheet");
const waiting = document.getElementById("waiting");
const stateLabel = document.getElementById("stateLabel");
const form = document.getElementById("suggest");
const word = document.getElementById("word");
const send = document.getElementById("send");
const sent = document.getElementById("sent");

let text = "";
let seq = -1;      // last applied edit; -1 = no snapshot yet
let caret = 0;
let live = false;
let typingT, thinkT;

const caretEl = document.createElement("span");
caretEl.className = "caret idle";

// Draw the text with the writer's caret inside it; freshly typed characters fade in.
function render(freshFrom = -1, freshLen = 0) {
  const c = Math.max(0, Math.min(caret, text.length));
  sheet.textContent = "";
  const parts = [];
  if (freshLen > 0 && freshFrom >= 0) {
    const fEnd = freshFrom + freshLen;
    const cut = [0, freshFrom, fEnd, text.length, c].filter((v, i, a) => a.indexOf(v) === i).sort((a, b) => a - b);
    for (let i = 0; i < cut.length - 1; i++) parts.push([cut[i], cut[i + 1]]);
  } else {
    parts.push([0, c], [c, text.length]);
  }
  for (const [a, b] of parts) {
    if (a === c) sheet.append(caretEl);
    if (b <= a) continue;
    const s = text.slice(a, b);
    if (freshLen > 0 && a >= freshFrom && b <= freshFrom + freshLen) {
      const span = document.createElement("span"); span.className = "fresh"; span.textContent = s; sheet.append(span);
    } else sheet.append(s);
  }
  if (c === text.length && caretEl.parentNode !== sheet) sheet.append(caretEl);
  waiting.classList.toggle("gone", live || text.length > 0);
  follow();
}

// While keys arrive the caret holds still; when they stop it blinks; a long pause slows it to a breath.
function typed() {
  caretEl.className = "caret";
  clearTimeout(typingT); clearTimeout(thinkT);
  typingT = setTimeout(() => { caretEl.className = "caret idle"; }, 700);
  thinkT = setTimeout(() => { caretEl.className = "caret thinking"; }, 4000);
}

function follow() {
  const r = caretEl.getBoundingClientRect();
  if (r.bottom > innerHeight - 140 || r.top < 80) caretEl.scrollIntoView({ block: "center", behavior: "smooth" });
}

function setLive(on) {
  live = on;
  document.body.classList.toggle("is-live", on);
  stateLabel.textContent = on ? "Live" : (text ? "Paused" : "Not live");
  caretEl.style.visibility = on ? "visible" : "hidden";
}

const bus = await createBus(room, "audience");

bus.on("snap", (p) => {
  text = String(p.text || ""); seq = p.seq; caret = p.caret ?? text.length;
  setLive(!!p.live); render();
});
bus.on("state", (p) => { setLive(!!p.live); render(); });
bus.on("op", (p) => {
  if (seq < 0) return;                                  // waiting for a snapshot
  if (p.seq !== seq + 1) { seq = -1; bus.send("resync", {}); return; }  // missed something
  seq = p.seq;
  text = apply(text, p);
  caret = p.caret ?? p.at + p.ins.length;
  if (!live) setLive(true);
  render(p.ins.length ? p.at : -1, p.ins.length);
  typed();
});
bus.on("caret", (p) => { if (p.seq === seq) { caret = p.caret; render(); } });

word.addEventListener("input", () => { send.disabled = !word.value.trim(); });
let lastSent = 0;
form.addEventListener("submit", (e) => {
  e.preventDefault();
  const v = word.value.replace(/\s+/g, " ").trim().slice(0, 80);
  if (!v) return;
  const wait = 5000 - (Date.now() - lastSent);
  if (wait > 0) { flash(`One moment… (${Math.ceil(wait / 1000)}s)`); return; }
  bus.send("suggest", { text: v });
  lastSent = Date.now();
  word.value = ""; send.disabled = true;
  flash("Sent to the writer");
});
function flash(m) { sent.textContent = m; sent.classList.add("on"); clearTimeout(flash.t); flash.t = setTimeout(() => sent.classList.remove("on"), 1800); }

setLive(false); render();
await bus.ready;
bus.send("hello", {});
setTimeout(() => { if (seq < 0) bus.send("hello", {}); }, 2500);
</script>
</body>
</html>
